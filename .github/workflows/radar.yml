name: AI Career Radar

# Gündüz her 30 dakikada bir (06:07–23:37 TR), gece bir kez (03:07 TR) çalışır.
# Bilgisayarın açık olması gerekmez; her şey GitHub sunucularında olur.
on:
  schedule:
    - cron: "7,37 3-20 * * *"
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-state
  cancel-in-progress: false

jobs:
  tur:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-actions.txt

      - name: Paketler
        run: pip install -q -r requirements-actions.txt

      - name: Kayıtları al (şifreli)
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch -q --depth=1 origin state
            git show FETCH_HEAD:radar.db.enc > state/radar.db.enc
            echo "Kayıtlar alındı ($(du -k state/radar.db.enc | cut -f1) KB)"
          else
            echo "İlk çalıştırma: kayıt dalı henüz yok."
          fi

      - name: Tara, değerlendir, Telegram'a gönder
        env:
          RADAR_KEY: ${{ secrets.RADAR_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m radar.runner

      - name: Kayıtları sakla (şifreli, tek commit)
        if: always()
        run: |
          [ -s state/radar.db.enc ] || { echo "Kaydedilecek dosya yok."; exit 0; }
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          blob=$(git hash-object -w state/radar.db.enc)
          tree=$(printf "100644 blob %s\tradar.db.enc\n" "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "kayit $(date +%F' '%H:%M)")
          for i in 1 2 3; do git push -q -f origin "$commit:refs/heads/state" && break; sleep 5; done

      - name: Canlı tut (GitHub 60 gün hareketsiz depoda zamanlamayı durdurur)
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "radar-bot"
            git config user.email "radar-bot@users.noreply.github.com"
            date -u +%F > .keepalive
            git add .keepalive && git commit -q -m "canlı tut" && git push -q
          fi
